name: Update feed and publish

on:
  schedule:
    - cron: "23 13 * * *"   # about 6am Pacific
    - cron: "23 1 * * *"    # about 6pm Pacific
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mi-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch newest videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/fetch_feed.py

      - name: Save the updated feed
        run: |
          git config user.name "mi-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update feed" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
